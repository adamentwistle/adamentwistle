name: weekly curation pipeline

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: find candidates
        run: python scripts/find_candidates.py
        env:
          GITHUB_TOKEN: ${{ secrets.CURATION_PAT }}
          REPO: adamentwistle/awesome-ai-agents-production
