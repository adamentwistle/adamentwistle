name: daily digest

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch and write digest
        run: python scripts/fetch_digest.py

      - name: commit digest
        run: |
          git config user.name "adamentwistle"
          git config user.email "adamentwistle@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet \
            || (git add . \
            && git commit -m "digest: $(date +'%Y-%m-%d') [skip ci]" \
            && git push)
